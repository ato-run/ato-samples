name: hello Capsule pack and verify

on:
  pull_request:
    paths:
      - "samples/hello/**"
      - ".github/workflows/hello-capsule.yml"
  push:
    branches: [main]
    paths:
      - "samples/hello/**"
      - ".github/workflows/hello-capsule.yml"
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned released Ato CLI
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/ato-run/ato/releases/download/v0.9.2
          archive=ato-cli-x86_64-unknown-linux-gnu.tar.xz
          curl -fsSLo "$archive" "$base/$archive"
          curl -fsSLo "$archive.sha256" "$base/$archive.sha256"
          sha256sum -c "$archive.sha256"
          tar -xJf "$archive"
          echo "$PWD/ato-cli-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Pack and verify real Contract observations
        shell: bash
        run: |
          set -euo pipefail
          ato --version
          mkdir -p .tmp/hello
          ato pack samples/hello -o .tmp/hello/hello.capsule
          ato run .tmp/hello/hello.capsule --no-open \
            --verification-receipt .tmp/hello/receipt.json
          python3 - <<'PY'
          import json
          with open(".tmp/hello/receipt.json", encoding="utf-8") as file:
              receipt = json.load(file)
          assert receipt["fully_satisfied"] is True, receipt
          print("Hello Capsule: accepted Contract receipt")
          PY

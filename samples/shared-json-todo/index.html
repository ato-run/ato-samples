<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="head">
        <h1>Todo</h1>
        <p class="where" id="where" role="status">Opening your data…</p>
      </header>

      <form class="compose" id="compose" hidden>
        <label class="sr" for="title">Task</label>
        <input id="title" name="title" placeholder="Add a task" autocomplete="off" required />

        <label class="sr" for="description">Description</label>
        <input id="description" name="description" placeholder="Description (optional)" autocomplete="off" />

        <label class="sr" for="priority">Priority</label>
        <select id="priority" name="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>

        <label class="sr" for="column">Column</label>
        <select id="column" name="column"></select>

        <label class="sr" for="due">Due date</label>
        <input id="due" name="due" type="date" />

        <button type="submit">Add</button>
      </form>

      <p class="problem" id="problem" role="alert" hidden></p>

      <!-- Empty data is a state, not a signal: starting a board is something a
           person asks for, never something a blank document triggers. -->
      <section class="start" id="start" hidden>
        <p>This data is empty.</p>
        <button type="button" id="start-board">
          Start a new board in this data
        </button>
      </section>

      <div class="board" id="board"></div>
      <p class="empty" id="empty" hidden>No tasks yet. Add the first one above.</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>

# ato.capsule/2 authoring: one static browser route over the sample tree, so
# `ato pack` can build a portable bundle (Calendar uses the same form). Data
# access is not part of K: the Ports in ato.data.toml and the operations in
# ato.operations.yaml are admitted at run time.
schema = "ato.capsule/2"

[application]
title = "Task Board"
surface_path = "/"

[[input]]
id = "workspace"
use = "ato.workspace@1"
path = "."

[contract]
mode = "all"

[[contract.observation]]
id = "page"
use = "ato.contract.http@1"
port = "app.http"
method = "GET"
path = "/"
status = 200

[[derivation]]
id = "web"
use = "ato.browser@1"
runtimes = {}
entry = "index.html"
spa_fallback = false

[effects]
default = "pure"

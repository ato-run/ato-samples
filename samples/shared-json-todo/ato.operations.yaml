schema: ato.operations/v2
operations:
  - id: todo_list
    title: todo.list
    description: "Task Boardに保存されているTODOを一覧取得する。各TODOには #001 形式の通し番号 ref を含む"
    input:
      type: object
      properties: {}
      additionalProperties: false
    execution:
      kind: state_transform
      use: ato.javascript@1
      module: ./src/operations/todo.js
      export: listTodos
    semantics: observation
    state:
      kind: data_port
      port: tasks
      protocol: todo.board@1
      access: read
    effects:
      external: none
    expose:
      mcp: true
      webmcp: false
  - id: todo_get
    title: todo.get
    description: "内部IDまたは #023 のような通し番号を指定してTask BoardのTODOを1件取得する"
    input:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - id
      additionalProperties: false
    execution:
      kind: state_transform
      use: ato.javascript@1
      module: ./src/operations/todo.js
      export: getTodo
    semantics: observation
    state:
      kind: data_port
      port: tasks
      protocol: todo.board@1
      access: read
    effects:
      external: none
    expose:
      mcp: true
      webmcp: false
  - id: todo_get_by_number
    title: todo.get_by_number
    description: TODOの通し番号を指定して詳細を取得する。#023 と言われた場合は number=23 を渡す
    input:
      type: object
      properties:
        number:
          type: integer
          minimum: 1
      required:
        - number
      additionalProperties: false
    execution:
      kind: state_transform
      use: ato.javascript@1
      module: ./src/operations/todo.js
      export: getTodoByNumber
    semantics: observation
    state:
      kind: data_port
      port: tasks
      protocol: todo.board@1
      access: read
    effects:
      external: none
    expose:
      mcp: true
      webmcp: false
  - id: todo_create
    title: todo.create
    description: Task Boardに新しいTODOを作成する
    input:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 5000
        column_id:
          type: string
          minLength: 1
          maxLength: 256
        priority:
          type: string
          enum:
            - none
            - low
            - medium
            - high
        due_at:
          type: string
          maxLength: 32
        completed:
          type: boolean
        subtasks:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 256
              title:
                type: string
                minLength: 1
                maxLength: 240
              completed:
                type: boolean
              order:
                type: integer
                minimum: 0
            required:
              - title
            additionalProperties: false
        at:
          type: string
          minLength: 24
          maxLength: 24
      required:
        - title
        - at
      additionalProperties: false
    execution:
      kind: state_transform
      use: ato.javascript@1
      module: ./src/operations/todo.js
      export: createTodo
    semantics: evolution
    state:
      kind: data_port
      port: tasks
      protocol: todo.board@1
      access: read_write
    effects:
      external: none
    expose:
      mcp: true
      webmcp: false
  - id: todo_update
    title: todo.update
    description: "内部IDまたは #023 のような通し番号を指定してTask BoardのTODOを部分更新する"
    input:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 5000
        column_id:
          type: string
          minLength: 1
          maxLength: 256
        priority:
          type: string
          enum:
            - none
            - low
            - medium
            - high
        due_at:
          type: string
          maxLength: 32
        completed:
          type: boolean
        archived:
          type: boolean
        subtasks:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 256
              title:
                type: string
                minLength: 1
                maxLength: 240
              completed:
                type: boolean
              order:
                type: integer
                minimum: 0
            required:
              - title
            additionalProperties: false
        recurrence_enabled:
          type: boolean
        recurrence_weekday:
          type: integer
          minimum: 1
          maximum: 7
        at:
          type: string
          minLength: 24
          maxLength: 24
      required:
        - id
        - at
      additionalProperties: false
    execution:
      kind: state_transform
      use: ato.javascript@1
      module: ./src/operations/todo.js
      export: updateTodo
    semantics: evolution
    state:
      kind: data_port
      port: tasks
      protocol: todo.board@1
      access: read_write
    effects:
      external: none
    expose:
      mcp: true
      webmcp: false
  - id: todo_initialize
    title: todo.initialize
    description: todo_initialize
    input:
      type: object
      properties:
        date:
          type: string
          minLength: 10
          maxLength: 10
        at:
          type: string
          minLength: 24
          maxLength: 24
      required:
        - date
        - at
      additionalProperties: false
    execution:
      kind: state_transform
      use: ato.javascript@1
      module: ./src/operations/todo.js
      export: initializeBoard
    semantics: evolution
    state:
      kind: data_port
      port: tasks
      protocol: todo.board@1
      access: read_write
    effects:
      external: none
    expose:
      mcp: false
      webmcp: false

# ato.capsule/2 authoring: one static browser route over the sample tree.
#
# The Contract says only what is required to call this app up: its entry page
# answers GET / with 200 over the declared HTTP Port. Data access is separate
# from K: the Ports in ato.data.toml and the operations in ato.operations.yaml
# are admitted at run time by the person's grant.
schema = "ato.capsule/2"

[application]
title = "shared-json-calendar"
surface_path = "/"

[[input]]
id = "workspace"
use = "ato.workspace@1"
path = "."

[contract]
mode = "all"

[[contract.observation]]
id = "page"
use = "ato.contract.http@1"
port = "app.http"
method = "GET"
path = "/"
status = 200

[[derivation]]
id = "web"
use = "ato.browser@1"
runtimes = {}
entry = "index.html"

[effects]
default = "pure"

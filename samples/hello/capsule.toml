# Ato first-run tutorial: one browser realization of an explicit Contract.
schema = "ato.capsule/2"

[application]
title = "Hello, Ato"
surface_path = "/"

[[input]]
id = "workspace"
use = "ato.workspace@1"
path = "."

[contract]
mode = "all"

[[contract.observation]]
id = "hello-page"
use = "ato.contract.http@1"
port = "app.http"
method = "GET"
path = "/"
status = 200

[[contract.observation]]
id = "hello-proof"
use = "ato.contract.http@1"
port = "app.http"
method = "GET"
path = "/proof.txt"
status = 200
body_digest = "sha256:95eede0a67eb5f294cde72ecc73861eec76e9b2dfe7b8479dabd49301dbeca38"

[[derivation]]
id = "web"
use = "ato.browser@1"
runtimes = {}
entry = "index.html"

[effects]
default = "pure"

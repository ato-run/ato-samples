<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Excalidraw</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="bar">
        <h1>Excalidraw</h1>
        <p class="status" id="status" role="status">Opening the scene…</p>
        <div class="actions">
          <button id="save" type="button" disabled>Save checkpoint</button>
          <button id="export" type="button" disabled>Export scene</button>
        </div>
      </header>
      <p class="problem" id="problem" role="alert" hidden></p>
      <div class="canvas" id="root"></div>
    </main>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
